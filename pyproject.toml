[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duo-plan"
version = "0.1.0"
description = "Alternate Codex and Claude plan reviews with LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.0,<2"]

[project.scripts]
duo = "duo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
