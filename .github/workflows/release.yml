name: Release

# A v* tag builds and checks the release files with scripts/release.py and
# attaches them, with build-provenance attestations, to a draft release. The
# owner fills in the notes and publishes the draft. Run it by hand on any ref
# for a dry run: the same checks and build, without attestations or a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read  # to read the CI results for this commit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag against the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      - name: Require passing CI on this exact commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag push starts its own CI run, which is still running; judge the
          # completed runs. Every one must have passed, and there must be one.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed") | .conclusion]' > conclusions.json
          python3 - <<'EOF'
          import json, sys
          conclusions = json.load(open("conclusions.json"))
          print("Completed CI runs for this commit:", conclusions or "none")
          if not conclusions or any(c != "success" for c in conclusions):
              sys.exit("::error::CI has not passed on this commit; rerun it before tagging")
          EOF
      - name: Build and check the release files
        run: python3 scripts/release.py "$GITHUB_SHA" --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/final/
            ${{ runner.temp }}/release/notes.md
          if-no-files-found: error

  draft:
    # Only this job can write releases and attestations, and only for tags.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/final/*.whl
            release/final/*.tar.gz
            release/final/constraints.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release/final && sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file ../notes.md ./*.whl ./*.tar.gz constraints.txt SHA256SUMS
