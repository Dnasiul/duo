name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Offline tests with fake CLIs; no reviewer credentials are used.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The declared minimum and the newest supported release.
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
      - name: Run tests against the installed package
        # Run outside the checkout's src so the installed wheel is what gets tested.
        working-directory: tests
        run: python -B -m unittest discover -s . -v
      - name: Check the installed entry point
        run: duo --help
