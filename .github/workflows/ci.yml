name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Offline tests with fake CLIs; no reviewer credentials are used. Each
    # artifact is installed into a clean environment with the tested
    # dependency versions (constraints.txt) and tested from outside src/.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; keep the token out of the job's git config.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - name: Install and test each artifact
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            echo "::group::$artifact"
            env="$RUNNER_TEMP/env-$(basename "$artifact")"
            python -m venv "$env"
            "$env/bin/python" -m pip install --disable-pip-version-check -c constraints.txt "$artifact"
            # Strict: a failure or any skipped test (e.g. missing LangGraph) fails.
            (cd tests && "$env/bin/python" -B ../scripts/run_tests.py)
            "$env/bin/duo" --help > /dev/null
            "$env/bin/duo-clean" --help > /dev/null
            echo "::endgroup::"
          done

  latest-dependencies:
    # The newest releases within pyproject.toml's ranges, to see upstream
    # breakage before regenerating constraints.txt.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install without constraints and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          cd tests && python -B ../scripts/run_tests.py

  audit:
    # Known vulnerabilities in the tested dependency versions.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Audit constraints.txt
        run: |
          python -m pip install pip-audit
          pip-audit --strict -r constraints.txt
