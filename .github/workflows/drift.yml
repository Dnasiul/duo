name: CLI drift

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Newest CLI releases against Duo's version policy, control probes, and
    # recorded fixtures. No reviewer credentials are used.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes; keep the token out of the job's git config.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Duo and the newest CLIs
        run: |
          python -m pip install .
          npm install -g --no-fund --no-audit @openai/codex@latest @anthropic-ai/claude-code@latest @github/copilot@latest
      - name: Check CLIs
        run: python scripts/check_drift.py --json drift-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drift-${{ matrix.os }}
          path: drift-${{ matrix.os }}.json
          if-no-files-found: warn

  report:
    # One issue tracks drift: opened or commented on when any platform needs
    # attention (see scripts/drift_report.py), closed only when every platform
    # reported every CLI compatible against its reviewed baseline.
    needs: check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        # No artifacts at all is reported as missing results, not skipped.
        continue-on-error: true
        with:
          pattern: drift-*
          path: results
          merge-multiple: true
      - name: Open, update, or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CLI drift: action needed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          shopt -s nullglob
          action=$(python3 scripts/drift_report.py --platforms ubuntu-latest macos-latest \
            --run-url "$RUN_URL" --open-issue "$number" --body body.md results/drift-*.json)
          case "$action" in
            create) gh issue create --title "$title" --body-file body.md ;;
            comment) gh issue comment "$number" --body-file body.md ;;
            close) gh issue close "$number" --comment "All CLIs are compatible with their reviewed baselines on every platform: $RUN_URL" ;;
            none) ;;
            *) echo "::error::unexpected drift report action: $action"; exit 1 ;;
          esac
          cat body.md >> "$GITHUB_STEP_SUMMARY"
